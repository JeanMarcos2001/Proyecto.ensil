<html lang="es" class="scroll-smooth">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ENSIL PERÚ - Lectura Integral</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Arapey:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,300;400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet"/>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1A4D2E", // Deep Forest Green
                        secondary: "#285626", // Lighter Green from hero
                        accent: "#C5A059",  // Gold
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1F2937",
                        "background-light": "#F9FAFB",
                        "background-dark": "#111827",
                        
                        // New Design Specific Colors
                        "ensil-green": "#14532d",
                        "ensil-gold": "#C5A059",
                        "ensil-warning": "#fff7ed",
                        "ensil-warning-border": "#fdba74",
                    },
                    fontFamily: {
                        display: ["Montserrat", "sans-serif"],
                        serif: ["Arapey", "serif"],
                        body: ["Inter", "sans-serif"],
                        // New Design Specific Fonts mapped to existing or added
                        fraunces: ["Fraunces", "serif"],
                        jakarta: ["Plus Jakarta Sans", "sans-serif"],
                    },
                    backgroundImage: {
                        'hero-pattern': "url('https://images.unsplash.com/photo-1507842217121-9e962835bf0e?q=80&w=2574&auto=format&fit=crop')",
                    },
                    boxShadow: {
                        'soft': '0 20px 40px -10px rgba(0, 0, 0, 0.05)',
                        'soft-hover': '0 25px 50px -12px rgba(0, 0, 0, 0.15)',
                    }
                },
            },
        };
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .cta-gradient {
            background: linear-gradient(135deg, #1A4D2E 0%, #2A6640 50%, #1A4D2E 100%);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #C5A059; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #1A4D2E; 
        }
        .text-underline-doodle {
            position: relative;
            display: inline-block;
        }
        .text-underline-doodle::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 2px;
            width: 100%;
            height: 8px;
            background-color: #facc15;
            opacity: 0.4;
            z-index: -1;
            border-radius: 4px;
            transform: skew(-10deg) rotate(-1deg);
        }
    </style>
